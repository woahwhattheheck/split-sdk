name: verify-617 check

on:
  push:
    branches: [ "ci/verify-617", "ci/baseline-main" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck (tsc --noEmit) - capture baseline
        run: |
          set +e
          npx tsc --noEmit > tsc.out 2>&1
          echo "exit=$?"
          echo "TOTAL_TS_ERRORS=$(grep -cE 'error TS' tsc.out || echo 0)"
          echo "--- errors in src/webhooks/verify.ts ---"
          grep -E '^src/webhooks/verify\.ts' tsc.out || echo "(none)"
          echo "--- errors in src/index.ts ---"
          grep -cE '^src/index\.ts' tsc.out || echo 0
          echo "--- index.ts error line numbers ---"
          grep -oE '^src/index\.ts\([0-9]+' tsc.out | sort -u -t'(' -k2 -n | tr '\n' ' ' || true
          echo

      - name: Unit tests for the webhook verifier
        if: always()
        run: ls test/webhooks.verify.test.ts 2>/dev/null && npx vitest run test/webhooks.verify.test.ts || echo "no verifier test on baseline (expected)"
