name: verify-772 check
on:
  push:
    branches: [ "ci/verify-772" ]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          set +e
          npx tsc --noEmit > tsc.out 2>&1
          echo "TOTAL_TS_ERRORS=$(grep -cE 'error TS' tsc.out || echo 0)"
          echo "--- errors in files touched by this PR ---"
          grep -E '^src/(errors|index)\.ts|^src/wallets/adapters/FreighterAdapter\.ts|^test/freighterAdapter\.test\.ts' tsc.out || echo "(none)"
      - name: New unit tests
        if: always()
        run: npx vitest run test/freighterAdapter.test.ts
      - name: Existing wallet suite (regression)
        if: always()
        run: npx vitest run test/walletSessionManager.test.ts
