name: verify-773 check
on:
  push:
    branches: [ "ci/verify-773" ]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck (tsc --noEmit)
        run: |
          set +e
          npx tsc --noEmit > tsc.out 2>&1
          echo "TOTAL_TS_ERRORS=$(grep -cE 'error TS' tsc.out || echo 0)"
          echo "--- errors in src/graph/PaymentGraphChecker.ts ---"
          grep -E '^src/graph/PaymentGraphChecker\.ts' tsc.out || echo "(none)"
      - name: Unit tests
        if: always()
        run: npx vitest run test/paymentGraphChecker.test.ts
